name: Compose Multiplatform CI

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ 'main' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 安装 Java
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Reuse the Gradle dependency, transform, wrapper, and build caches between workflow runs.
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      # 安装 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 构建 Android APK
      - name: Build Android Release
        id: build
        run: |
          VERSION_CODE="$(git show -s --format=%ct HEAD)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="$(awk -F= '/^appVersionName=/{print $2; exit}' gradle.properties)"
          fi
          ./gradlew :android:assembleRelease \
            "-PappVersionCode=${VERSION_CODE}" \
            "-PappVersionName=${VERSION_NAME}"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      # 按 ABI 分别上传 APK，避免合并为同一个下载包。
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v6
        with:
          name: android-release-apk-arm64-v8a
          path: android/build/outputs/apk/release/*-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@v6
        with:
          name: android-release-apk-x86
          path: android/build/outputs/apk/release/*-x86-release.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v6
        with:
          name: android-release-apk-x86_64
          path: android/build/outputs/apk/release/*-x86_64-release.apk
          if-no-files-found: error

      # Keep a single rolling pre-release available for testers on the main branch.
      - name: Upload APKs to rolling pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          RELEASE_TAG="pre-release"
          RELEASE_NAME="Pre-release"
          RELEASE_BODY="自动构建自 [${GITHUB_SHA}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})

          - channel：pre-release
          - versionCode：${VERSION_CODE}
          - versionName：${VERSION_NAME}

          ### 本次提交
          ${COMMIT_MESSAGE}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_NAME}" --prerelease --latest=false --notes "${RELEASE_BODY}"
          else
            gh release create "${RELEASE_TAG}" --title "${RELEASE_NAME}" --prerelease --latest=false --target "${GITHUB_SHA}" --notes "${RELEASE_BODY}"
          fi
          gh release upload "${RELEASE_TAG}" android/build/outputs/apk/release/*-release.apk --clobber

      - name: Upload APKs to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && success()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_NAME="Release ${VERSION_NAME}"
          RELEASE_BODY="正式版本 [${GITHUB_SHA}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})

          - versionCode：${VERSION_CODE}
          - versionName：${VERSION_NAME}

          ### 本次提交
          ${COMMIT_MESSAGE}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_NAME}" --latest --notes "${RELEASE_BODY}"
          else
            gh release create "${RELEASE_TAG}" --title "${RELEASE_NAME}" --latest --target "${GITHUB_SHA}" --notes "${RELEASE_BODY}"
          fi
          gh release upload "${RELEASE_TAG}" android/build/outputs/apk/release/*-release.apk --clobber
