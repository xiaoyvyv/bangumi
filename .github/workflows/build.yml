name: Compose Multiplatform CI

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ 'main' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 安装 Java
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Reuse the Gradle dependency, transform, wrapper, and build caches between workflow runs.
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # 安装 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 构建 Android APK
      - name: Build Android Release
        id: build
        run: |
          VERSION_CODE="$(git show -s --format=%ct HEAD)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="$(awk -F= '/^appVersionName=/{print $2; exit}' gradle.properties)"
          fi
          ./gradlew :android:assembleRelease \
            "-PappVersionCode=${VERSION_CODE}" \
            "-PappVersionName=${VERSION_NAME}"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      # 按 ABI 分别上传 APK，避免合并为同一个下载包。
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v6
        with:
          name: android-release-apk-arm64-v8a
          path: android/build/outputs/apk/release/*-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@v6
        with:
          name: android-release-apk-x86
          path: android/build/outputs/apk/release/*-x86-release.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v6
        with:
          name: android-release-apk-x86_64
          path: android/build/outputs/apk/release/*-x86_64-release.apk
          if-no-files-found: error

      # Keep a single rolling pre-release available for testers on the main branch.
      - name: Upload APKs to rolling pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: pre-release
          name: Pre-release
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            自动构建自 [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            - channel：pre-release
            - versionCode：${{ steps.build.outputs.version_code }}
            - versionName：${{ steps.build.outputs.version_name }}

            ### 本次提交
            ${{ github.event.head_commit.message }}
          files: |
            android/build/outputs/apk/release/*-arm64-v8a-release.apk
            android/build/outputs/apk/release/*-x86-release.apk
            android/build/outputs/apk/release/*-x86_64-release.apk

      - name: Upload APKs to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.build.outputs.version_name }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          body: |
            正式版本 [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            - versionCode：${{ steps.build.outputs.version_code }}
            - versionName：${{ steps.build.outputs.version_name }}

            ### 本次提交
            ${{ github.event.head_commit.message }}
          files: |
            android/build/outputs/apk/release/*-arm64-v8a-release.apk
            android/build/outputs/apk/release/*-x86-release.apk
            android/build/outputs/apk/release/*-x86_64-release.apk
