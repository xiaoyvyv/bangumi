name: Compose Desktop CI

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ 'main' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-version:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          VERSION_CODE="$(git show -s --format=%ct HEAD)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            CHANNEL="release"
          else
            VERSION_NAME="$(awk -F= '/^appVersionName=/{print $2; exit}' gradle.properties)"
            CHANNEL="pre-release"
          fi
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

  build-desktop:
    name: Build Desktop (${{ matrix.name }})
    needs: prepare-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            platform: linux
            format: deb
          - name: macOS
            os: macos-latest
            platform: macos
            format: dmg
          - name: Windows
            os: windows-latest
            platform: windows
            format: msi
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Build desktop package
        run: ./gradlew :composeApp:packageReleaseDistributionForCurrentOS "-PappVersionCode=${{ needs.prepare-version.outputs.version_code }}" "-PappVersionName=${{ needs.prepare-version.outputs.version_name }}"

      - name: Rename desktop package
        shell: bash
        run: |
          package_dir="composeApp/build/compose/binaries/main-release/${{ matrix.format }}"
          package_path="$(find "${package_dir}" -maxdepth 1 -type f -name "*.${{ matrix.format }}" -print -quit)"
          test -n "${package_path}"
          cp "${package_path}" "${package_dir}/bangumi-${{ matrix.platform }}-${{ needs.prepare-version.outputs.version_name }}.${{ matrix.format }}"

      - name: Upload desktop package
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.platform }}
          path: composeApp/build/compose/binaries/main-release/${{ matrix.format }}/bangumi-${{ matrix.platform }}-${{ needs.prepare-version.outputs.version_name }}.${{ matrix.format }}
          if-no-files-found: error

  publish-desktop:
    name: Publish Desktop packages
    needs: [ prepare-version, build-desktop ]
    if: github.event_name == 'push' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          path: desktop-release
          merge-multiple: true

      - name: Upload packages to rolling pre-release
        if: needs.prepare-version.outputs.channel == 'pre-release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
          VERSION_NAME: ${{ needs.prepare-version.outputs.version_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          RELEASE_TAG="pre-release"
          RELEASE_NAME="Pre-release"
          RELEASE_BODY="自动构建自 [${GITHUB_SHA}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})

          - channel：pre-release
          - versionCode：${VERSION_CODE}
          - versionName：${VERSION_NAME}

          ### 本次提交
          ${COMMIT_MESSAGE}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_NAME}" --prerelease --latest=false --notes "${RELEASE_BODY}"
          else
            gh release create "${RELEASE_TAG}" --title "${RELEASE_NAME}" --prerelease --latest=false --target "${GITHUB_SHA}" --notes "${RELEASE_BODY}"
          fi
          gh release upload "${RELEASE_TAG}" desktop-release/*.deb desktop-release/*.dmg desktop-release/*.msi --clobber

      - name: Upload packages to release
        if: needs.prepare-version.outputs.channel == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
          VERSION_NAME: ${{ needs.prepare-version.outputs.version_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          RELEASE_NAME="Release ${VERSION_NAME}"
          RELEASE_BODY="正式版本 [${GITHUB_SHA}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})

          - versionCode：${VERSION_CODE}
          - versionName：${VERSION_NAME}

          ### 本次提交
          ${COMMIT_MESSAGE}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_NAME}" --latest --notes "${RELEASE_BODY}"
          else
            gh release create "${RELEASE_TAG}" --title "${RELEASE_NAME}" --latest --target "${GITHUB_SHA}" --notes "${RELEASE_BODY}"
          fi
          gh release upload "${RELEASE_TAG}" desktop-release/*.deb desktop-release/*.dmg desktop-release/*.msi --clobber
