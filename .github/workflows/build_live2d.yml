name: Live2D Native Libraries CI

on:
  push:
    branches: [ 'main' ]
    paths:
      - 'shared/core-native/**'
      - '.github/workflows/build_live2d.yml'
  pull_request:
    branches: [ 'main' ]
    paths:
      - 'shared/core-native/**'
      - '.github/workflows/build_live2d.yml'
  workflow_dispatch:

jobs:
  build-macos-ios:
    name: Build macOS & iOS Native Libraries
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build macOS dylib
        run: ./shared/core-native/scripts/build_macos.sh

      - name: Build iOS static library (.a)
        run: ./shared/core-native/scripts/build_ios.sh

      - name: Upload macOS Native Library
        uses: actions/upload-artifact@v7
        with:
          name: live2d-native-macos
          path: shared/core-native/src/jvmMain/resources/native/macos/liblive2d_native.dylib

      - name: Upload iOS Native Library
        uses: actions/upload-artifact@v7
        with:
          name: live2d-native-ios
          path: shared/core-native/native/ios/

  build-android:
    name: Build Android Native Libraries (.so)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Build Android shared libraries (.so)
        run: ./shared/core-native/scripts/build_android.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload Android Native Libraries
        uses: actions/upload-artifact@v7
        with:
          name: live2d-native-android
          path: shared/core-native/src/androidMain/jniLibs/

  build-windows:
    name: Build Windows Native Library (.dll)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup MSVC Environment
        shell: cmd
        run: |
          for /f "tokens=*" %%i in ('vswhere -latest -property installationPath') do set VS_PATH=%%i
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          set >> "%GITHUB_ENV%"

      - name: Install GLEW via vcpkg
        shell: bash
        run: |
          vcpkg install glew:x64-windows
          echo "GLEW_DIR=C:/vcpkg/installed/x64-windows" >> $GITHUB_ENV

      - name: Build Windows dll
        shell: bash
        run: ./shared/core-native/scripts/build_windows.sh
        env:
          CMAKE_TOOLCHAIN_FILE: C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          VCPKG_TARGET_TRIPLET: x64-windows

      - name: Upload Windows Native Library
        uses: actions/upload-artifact@v7
        with:
          name: live2d-native-windows
          path: shared/core-native/src/jvmMain/resources/native/windows/live2d_native.dll

  build-linux:
    name: Build Linux Native Library (.so)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgl1-mesa-dev libglew-dev libx11-dev

      - name: Build Linux so
        run: ./shared/core-native/scripts/build_linux.sh

      - name: Upload Linux Native Library
        uses: actions/upload-artifact@v7
        with:
          name: live2d-native-linux
          path: shared/core-native/src/jvmMain/resources/native/linux/liblive2d_native.so
